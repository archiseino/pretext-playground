<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parasol</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @import './src/shared.css';

      #stage {
        position: relative;
        width: 100%;
        height: 420px;
        background: #05080f;
        border-radius: 8px;
        overflow: hidden;
        cursor: grab;
        user-select: none;
      }
      #stage.g {
        cursor: grabbing;
      }
      #rain {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hint {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: rgba(255, 255, 255, 0.25);
        font-family: monospace;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h2 class="sr-only">
      Text rain animation — words fall in columns, a draggable umbrella blocks
      and deflects them
    </h2>

    <div id="stage">
      <canvas id="rain"></canvas>
      <p id="hint">drag the umbrella</p>
    </div>

    <script type="module">
      // Fixed, self-contained implementation:
      const stage = document.getElementById('stage');
      const canvas = document.getElementById('rain');
      const ctx = canvas.getContext('2d');
      const hint = document.getElementById('hint');

      // Visual constants
      // Increase spacing so the rain feels less cramped
      const COL_SPACING = 16;
      const CHAR_HEIGHT = 16;
      const FONT = 'bold 12px "JetBrains Mono", monospace';

      // Umbrella constants
      const UMBRELLA_RADIUS = 65;
      const HANDLE_LEN = 80;
      // Extra clearance around the canopy (bigger "gap" / shelter region)
      const UMBRELLA_GAP = 10;

      // State
      let W = 0;
      let H = 0;
      let columns = [];
      let lastTime = 0;
      const phrase = 'the rain in spain stays mainly in the plain ';
      const umb = { cx: 120, cy: 120 }; // initial umbrella center
      let dragging = false;
      let dragOffset = { x: 0, y: 0 };

      // Setup canvas size based on stage
      function resize() {
        const rc = stage.getBoundingClientRect();
        W = rc.width;
        H = Math.min(420, window.innerHeight * 0.55);
        canvas.width = Math.floor(W * devicePixelRatio);
        canvas.height = Math.floor(H * devicePixelRatio);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

        // Rebuild columns for new width/height
        const colCount = Math.max(3, Math.floor(W / COL_SPACING));
        columns = [];
        for (let i = 0; i < colCount; i++) {
          const charsNeeded = Math.ceil((H * 2) / CHAR_HEIGHT) + 10;
          columns.push({
            x: i * COL_SPACING + COL_SPACING / 2,
            chars: phrase.repeat(charsNeeded),
            y: Math.random() * H,
            speed: 60 + Math.random() * 80, // pixels per second
          });
        }
      }

      // Determine if a falling character at (px,py) is sheltered by umbrella centered at (ux,uy)
      function isUnderUmbrella(px, py, ux, uy) {
        const R = UMBRELLA_RADIUS;
        const canopyH = R * 0.65;
        // If above canopy top, not sheltered
        if (py < uy - canopyH - UMBRELLA_GAP) return false;
        // Horizontal check within radius (approx circular canopy)
        return (
          Math.abs(px - ux) < R + UMBRELLA_GAP &&
          py <= uy + HANDLE_LEN * 0.15 + UMBRELLA_GAP
        );
      }

      // Hit test to start dragging (click near umbrella canopy or handle)
      function hitUmb(x, y) {
        const dx = x - umb.cx;
        const dy = y - umb.cy;
        return Math.hypot(dx, dy) < UMBRELLA_RADIUS + 12;
      }

      // Draw umbrella (dome, scallops, pole, hook)
      function drawUmbrella(x, y) {
        const R = UMBRELLA_RADIUS;
        const canopyH = R * 0.65;
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#dfefff';
        ctx.lineWidth = 2;

        // Dome
        ctx.beginPath();
        ctx.moveTo(x - R, y);
        ctx.quadraticCurveTo(x, y - canopyH * 1.3, x + R, y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Scallops (3)
        ctx.fillStyle = '#f0f7ff';
        const panelW = (R * 2) / 3;
        for (let i = 0; i < 3; i++) {
          const cx = x - R + panelW * (i + 0.5);
          const cy = y;
          ctx.beginPath();
          ctx.moveTo(x - R + panelW * i, y);
          ctx.quadraticCurveTo(cx, y + R * 0.2, x - R + panelW * (i + 1), y);
          ctx.fill();
        }

        // Pole
        ctx.beginPath();
        ctx.strokeStyle = '#cfd9e6';
        ctx.lineWidth = 4;
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + HANDLE_LEN);
        ctx.stroke();

        // Hook
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.arc(x - 12, y + HANDLE_LEN, 12, Math.PI * 1, Math.PI * 2, true);
        ctx.stroke();

        ctx.restore();
      }

      // Animation frame
      function frame(ts) {
        if (!lastTime) lastTime = ts;
        const dt = (ts - lastTime) / 1000; // seconds
        lastTime = ts;

        // Clear
        ctx.clearRect(0, 0, W, H);

        // Draw characters
        ctx.font = FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#4a8ed4';

        for (const col of columns) {
          col.y += col.speed * dt;
          const blockH = col.chars.length * CHAR_HEIGHT;
          if (col.y >= blockH) col.y -= blockH;

          for (let i = 0; i < col.chars.length; i++) {
            const charY = i * CHAR_HEIGHT + col.y;
            const drawY = charY >= blockH ? charY - blockH : charY;
            if (drawY < -CHAR_HEIGHT || drawY > H + CHAR_HEIGHT) continue;
            if (isUnderUmbrella(col.x, drawY, umb.cx, umb.cy)) continue;
            ctx.fillText(col.chars[i], col.x, drawY);
          }
        }

        // Draw umbrella on top
        drawUmbrella(umb.cx, umb.cy);

        requestAnimationFrame(frame);
      }

      // Pointer / touch helpers
      function toXY(e) {
        const rc = stage.getBoundingClientRect();
        const p = e.touches ? e.touches[0] : e;
        return { x: p.clientX - rc.left, y: p.clientY - rc.top };
      }

      stage.addEventListener('mousedown', (e) => {
        const p = toXY(e);
        if (hitUmb(p.x, p.y)) {
          dragging = true;
          dragOffset.x = p.x - umb.cx;
          dragOffset.y = p.y - umb.cy;
          stage.classList.add('g');
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const p = toXY(e);
        umb.cx = Math.max(60, Math.min(W - 60, p.x - dragOffset.x));
        umb.cy = Math.max(60, Math.min(H - 60, p.y - dragOffset.y));
      });

      window.addEventListener('mouseup', () => {
        dragging = false;
        stage.classList.remove('g');
      });

      // Touch support
      stage.addEventListener(
        'touchstart',
        (e) => {
          const p = toXY(e);
          if (hitUmb(p.x, p.y)) {
            dragging = true;
            dragOffset.x = p.x - umb.cx;
            dragOffset.y = p.y - umb.cy;
            stage.classList.add('g');
            e.preventDefault();
          }
        },
        { passive: false },
      );

      window.addEventListener(
        'touchmove',
        (e) => {
          if (!dragging) return;
          const p = toXY(e);
          umb.cx = Math.max(60, Math.min(W - 60, p.x - dragOffset.x));
          umb.cy = Math.max(60, Math.min(H - 60, p.y - dragOffset.y));
          e.preventDefault();
        },
        { passive: false },
      );

      window.addEventListener('touchend', () => {
        dragging = false;
        stage.classList.remove('g');
      });

      // Initialize after font load
      (async () => {
        await document.fonts.ready;
        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
